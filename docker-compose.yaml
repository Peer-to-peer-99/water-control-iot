services:
  backend:
    container_name: water-control-iot-backend
    build:
      context: ./backend
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    container_name: water-control-iot-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  mobile:
    container_name: water-control-iot-mobile
    build:
      context: ./mobile
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules
    ports:
      - "5174:5173"
    command: npm run dev -- --host 0.0.0.0

  device-simulator:
    build:
      context: ./device/simulator
      dockerfile: Dockerfile
    container_name: water-control-iot-device-simulator
    restart: unless-stopped
    env_file:
      ./device/simulator/.env
    depends_on:
      - backend

  database:
    image: postgres:17
    container_name: water-control-iot-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  mobile_node_modules:
